plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zez.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.zez.app"
        minSdk 26
        targetSdk 34
        versionCode 57
        versionName "1.0.56"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // WorkManager for background background sync
    implementation 'androidx.work:work-runtime:2.9.0'

    // OkHttp & Gson for network requests & JSON parsing
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Glide for fast, memory-efficient image loading in Gallery
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // ViewPager2 for swipe-between-photos in Gallery viewer
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    // AndroidX Media for MediaSessionCompat and MediaStyle rich media notifications
    implementation 'androidx.media:media:1.7.0'
}
